apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      imagePullSecrets:
      - name: pelter-gmail-dockerhub
      containers:
      - name: {{ .Release.Name }}
        image: docker.io/jakepelter/investing-backend:{{ .Values.imageTag }}
        ports:
        - containerPort: 5000
        env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-investing
              key: postgres-password
        - name: POSTGRES_HOST
          value: {{ .Values.postgresHost }}
        - name: MINIO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dev-investing
              key: minio-password
        - name: MINIO_HOST
          value: {{ .Values.minioHost }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: {{ .Release.Name }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/limit-rpm: "15"
spec:
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Release.Name }}-tls
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - pathType: Prefix
        path: "/api"
        backend:
          service:
            name: {{ .Release.Name }}
            port:
              number: 5000